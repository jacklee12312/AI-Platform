      - --port
      - "17701"
      - -np
      - "2"
      - --alias
      - copaw-flash-9b
      - --api-key
      - ${HOUMO_API_KEY}
      - --reasoning
      - "off"
      - --jinja
      - --log-prefix
      - --log-timestamps
      - -lv
      - "4"
    healthcheck:
      test:
