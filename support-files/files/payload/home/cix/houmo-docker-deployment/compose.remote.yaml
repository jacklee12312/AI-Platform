name: houmo-ai

x-runtime-common: &runtime-common
  # Unified HLIELLama runtime baseline: llama.cpp 2.1.1 / TCIM 1.4.0.
  image: houmo-hliellama-xh2:2.1.1
  init: true
  read_only: true
  # modelctl owns boot ordering; a crash must retain isolation until explicit
  # recovery and real inference verification, not initiate another DMA load.
  restart: "no"
  environment:
    TZ: Asia/Shanghai
    HOUMO_API_KEY: ${HOUMO_API_KEY}
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"
  stop_grace_period: 30s

x-device-mappings: &device-mappings
  - /dev/xh2a_ctl0:/dev/xh2a_ctl0
  - /dev/xh2a_fast_memory_device0:/dev/xh2a_fast_memory_device0
  - /dev/xh2a_i2c_device0:/dev/xh2a_i2c_device0
  - /dev/xh2a_ipu0:/dev/xh2a_ipu0
  - /dev/xh2a_memory_allocator_device0_ddr:/dev/xh2a_memory_allocator_device0_ddr
  - /dev/xh2a_memory_allocator_device0_spm0:/dev/xh2a_memory_allocator_device0_spm0
  - /dev/xh2a_memory_allocator_device0_spm1:/dev/xh2a_memory_allocator_device0_spm1
  - /dev/xh2a_memory_transfer_device0:/dev/xh2a_memory_transfer_device0
  - /dev/xh2a_qspi_device0:/dev/xh2a_qspi_device0
  - /dev/xh2a_rpmsg_device0_0:/dev/xh2a_rpmsg_device0_0
  - /dev/xh2a_system_device0:/dev/xh2a_system_device0

x-lib-volume: &lib-volume
  type: bind
  source: /lib
  target: /lib
  read_only: true

x-arch-lib-volume: &arch-lib-volume
  type: bind
  source: /usr/lib/aarch64-linux-gnu
  target: /usr/lib/aarch64-linux-gnu
  read_only: true

x-sdk-volume: &sdk-volume
  type: bind
  source: /usr/local/houmo-drv-xh2_v1.4.0
  target: /usr/local/houmo-sdk
  read_only: true

x-localtime-volume: &localtime-volume
  type: bind
  source: /etc/localtime
  target: /etc/localtime
  read_only: true

