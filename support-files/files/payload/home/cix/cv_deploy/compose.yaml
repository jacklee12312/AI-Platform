services:
  cix-cv:
    image: cix-cv-noe:1.0.0
    container_name: cix-cv
    restart: unless-stopped
    devices:
    - /dev/aipu:/dev/aipu
    volumes:
    - ./models:/models:ro
    environment:
      MODEL_ROOT: /models
      CV_PORT: '17710'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_NO_INDEX: '1'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:17710/health', timeout=3))['ok']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    pull_policy: never
