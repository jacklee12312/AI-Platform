      read_only: true
    command:
    - -m
    - /models/copaw.gguf
    - --host
    - 0.0.0.0
    - --port
    - '17701'
    - -np
    - '2'
    - --alias
    - copaw-flash-9b
    - --api-key
    - ${HOUMO_API_KEY}
    - --reasoning
    - 'off'
    - --jinja
    - --log-prefix
    - --log-timestamps
    - -lv
    - '4'
    healthcheck:
      test:
      - CMD
      - /usr/bin/curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - '5'
      - --header
      - 'Authorization: Bearer ${HOUMO_API_KEY}'
